<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>每日学习任务 v2 - 静态 HTML 原型</title>
</head>
<body style="margin:0;background:#EEE;padding:32px;">
  <div style="display:flex;gap:24px;flex-wrap:wrap;justify-content:center;">

    <div style="width:375px;max-width:100%;font-family:-apple-system,sans-serif;background:#F7F7F8;min-height:600px;box-shadow:0 4px 24px rgba(0,0,0,.12);border-radius:16px;overflow:hidden;">
      <div style="padding:14px 18px;display:flex;align-items:center;justify-content:space-between;background:#fff;">
        <div style="font-size:13px;color:#8A8F98;">← 返回</div>
        <div style="font-size:12px;font-weight:700;color:#0E9F6E;">第 3 / 5 题</div>
      </div>
      <div style="padding:0 18px;background:#fff;">
        <div style="height:5px;background:#ECECEE;border-radius:3px;overflow:hidden;">
          <div style="width:60%;height:100%;background:#0E9F6E;"></div>
        </div>
      </div>

      <div style="padding:18px;">
        <span style="background:#E6F7F1;color:#0E9F6E;font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;">系统设计 · 核心</span>

        <div style="background:#fff;border:1px solid #ECECEE;border-radius:12px;padding:16px;margin-top:12px;">
          <div style="font-size:14px;line-height:1.6;color:#1A1A1F;">请设计一个短链接生成系统,说明你会如何解决高并发写入和链接唯一性问题?</div>
        </div>

        <textarea style="width:100%;height:140px;margin-top:14px;border-radius:10px;padding:12px;box-sizing:border-box;font-size:13px;border:1px solid #DADCE3;" placeholder="在这里输入你的回答…"></textarea>

        <button style="width:100%;background:#0E9F6E;border:none;color:#fff;padding:14px;border-radius:8px;font-weight:700;font-size:14px;margin-top:14px;">提交作答</button>
      </div>
    </div>

    <div style="width:375px;max-width:100%;font-family:-apple-system,sans-serif;background:#F7F7F8;min-height:600px;box-shadow:0 4px 24px rgba(0,0,0,.12);border-radius:16px;overflow:hidden;">
      <div style="padding:14px 18px;display:flex;align-items:center;justify-content:space-between;background:#fff;">
        <div style="font-size:13px;color:#8A8F98;">← 返回</div>
        <div style="font-size:12px;font-weight:700;color:#0E9F6E;">第 3 / 5 题</div>
      </div>

      <div style="padding:18px;">
        <div style="background:#fff;border:1px solid #ECECEE;border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;">
          <div style="width:48px;height:48px;border-radius:50%;background:#E6F7F1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#0E9F6E;">82</div>
          <div>
            <div style="font-weight:700;font-size:14px;color:#1A1A1F;">回答不错!</div>
            <div style="font-size:12px;color:#8A8F98;margin-top:2px;">考虑了分片写入,但唯一性方案可以更严谨</div>
          </div>
        </div>

        <div style="background:#fff;border:1px solid #ECECEE;border-radius:10px;padding:14px;margin-top:14px;">
          <div style="font-size:12px;font-weight:700;color:#0E9F6E;margin-bottom:6px;">参考答案要点</div>
          <div style="font-size:13px;color:#4A4F5A;line-height:1.6;">1. 用发号器/雪花算法保证唯一 ID<br/>2. 分库分表水平扩展写入能力<br/>3. 布隆过滤器提前拦截冲突...</div>
        </div>

        <div style="display:flex;justify-content:flex-end;align-items:center;margin-top:14px;">
          <div style="font-size:12px;color:#B0B3BB;">标记有误</div>
        </div>

        <button style="width:100%;background:#0E9F6E;border:none;color:#fff;padding:14px;border-radius:8px;font-weight:700;font-size:14px;margin-top:16px;">下一题 →</button>
      </div>
    </div>
  </div>
</body>
</html>
