<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>模拟面试 Tab · 未解锁/已解锁 - 静态 HTML 原型</title>
</head>
<body style="margin:0;background:#EEE;padding:32px;">
  <div style="display:flex;gap:24px;flex-wrap:wrap;justify-content:center;">

    <div style="width:340px;max-width:100%;font-family:-apple-system,sans-serif;background:#FAFAFC;box-shadow:0 4px 24px rgba(0,0,0,.12);border-radius:16px;overflow:hidden;">
      <div style="padding:16px;">
        <div style="font-size:11px;color:#9aa0ab;margin-bottom:8px;">未解锁</div>
        <div style="background:#fff;border:2px dashed #D8D4F5;border-radius:14px;padding:20px;text-align:center;">
          <div style="font-size:28px;margin-bottom:6px;">🔒</div>
          <div style="font-size:14px;font-weight:700;color:#333;">模拟面试待解锁</div>
          <div style="font-size:12px;color:#6b7280;margin-top:4px;">核心知识点「系统设计」还需提升 16%</div>
          <button style="margin-top:12px;background:#F4F1FF;border:none;color:#6C5CE7;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;">去学习 →</button>
        </div>
      </div>
    </div>

    <div style="width:340px;max-width:100%;font-family:-apple-system,sans-serif;background:#FAFAFC;box-shadow:0 4px 24px rgba(0,0,0,.12);border-radius:16px;overflow:hidden;">
      <div style="padding:16px;">
        <div style="font-size:11px;color:#9aa0ab;margin-bottom:8px;">已解锁</div>
        <button style="width:100%;background:linear-gradient(90deg,#6C5CE7,#8E7CF7);border:none;color:#fff;padding:14px;border-radius:12px;font-weight:700;font-size:14px;margin-bottom:14px;">🎤 开始新的模拟面试</button>

        <div style="font-size:12px;font-weight:700;color:#333;margin-bottom:8px;">历次报告</div>
        <div style="background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-size:13px;font-weight:600;color:#333;">09-14 · 第 3 次</div>
            <div style="font-size:11px;color:#6b7280;">比上次 +6</div>
          </div>
          <div style="font-size:16px;font-weight:800;color:#6C5CE7;">79</div>
        </div>
        <div style="background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-size:13px;font-weight:600;color:#333;">09-10 · 第 2 次</div>
          </div>
          <div style="font-size:16px;font-weight:800;color:#8a8fa3;">73</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
