<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>自由学习 · 回顾提问 - 静态 HTML 原型</title>
</head>
<body style="margin:0;background:#EEE;padding:32px;">
  <div style="width:375px;max-width:100%;margin:0 auto;font-family:-apple-system,sans-serif;background:#FAFAFC;min-height:600px;box-shadow:0 4px 24px rgba(0,0,0,.12);border-radius:16px;overflow:hidden;">

    <div style="padding:16px;background:#fff;border-bottom:1px solid #EEE;">
      <div style="font-size:14px;font-weight:700;color:#333;">💬 自由学习</div>
      <div style="font-size:11px;color:#999;margin-top:2px;">随时回顾,不占用今日任务进度</div>
    </div>

    <div style="padding:16px;">
      <div style="background:#F4F1FF;border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:12px;color:#6C5CE7;font-weight:700;">🎯 AI 为你选了「并发编程」做回顾</div>
        <div style="font-size:11px;color:#8E7CF7;">换一个 ↻</div>
      </div>

      <div style="background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);">
        <div style="font-size:14px;line-height:1.6;color:#222;">volatile 关键字能保证原子性吗?为什么?</div>
      </div>

      <textarea style="width:100%;height:110px;margin-top:14px;border-radius:12px;padding:12px;box-sizing:border-box;font-size:13px;border:1px solid #ddd;" placeholder="在这里输入你的回答…"></textarea>

      <button style="width:100%;background:linear-gradient(90deg,#6C5CE7,#8E7CF7);border:none;color:#fff;padding:14px;border-radius:12px;font-weight:700;font-size:14px;margin-top:14px;">提交回答</button>
    </div>
  </div>
</body>
</html>
