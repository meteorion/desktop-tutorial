<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>首页 / 掌握进度看板 - 静态 HTML 原型</title>
</head>
<body style="margin:0;background:#EEE;padding:32px;">
  <div style="width:375px;max-width:100%;margin:0 auto;font-family:-apple-system,sans-serif;background:#FAFAFC;box-shadow:0 4px 24px rgba(0,0,0,.12);border-radius:16px;overflow:hidden;">

    <div style="background:linear-gradient(135deg,#6C5CE7,#00D2A8);padding:20px 18px 24px;color:#fff;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-size:13px;opacity:.85;">目标岗位</div>
          <div style="font-size:18px;font-weight:800;">后端开发 · Java</div>
        </div>
        <div style="background:rgba(255,255,255,.22);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;">🔥 连续 5 天</div>
      </div>

      <div style="display:flex;align-items:center;gap:14px;margin-top:18px;">
        <div style="width:72px;height:72px;border-radius:50%;background:conic-gradient(#FFD93D 0deg 259deg, rgba(255,255,255,.25) 259deg 360deg);display:flex;align-items:center;justify-content:center;">
          <div style="width:58px;height:58px;border-radius:50%;background:#7C6CF0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;">72%</div>
        </div>
        <div>
          <div style="font-size:14px;font-weight:700;">整体掌握度 72%</div>
          <div style="font-size:12px;opacity:.85;margin-top:2px;">距解锁模拟面试还差 8%</div>
        </div>
      </div>
    </div>

    <div style="padding:16px 18px;">
      <div style="font-size:13px;font-weight:700;color:#333;margin-bottom:10px;">知识点掌握度</div>

      <div style="background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
          <span style="font-weight:600;color:#333;">Java 基础</span>
          <span style="color:#00B894;font-weight:700;">88%</span>
        </div>
        <div style="height:8px;background:#EEE;border-radius:4px;overflow:hidden;">
          <div style="width:88%;height:100%;background:linear-gradient(90deg,#00D2A8,#00B894);"></div>
        </div>
      </div>

      <div style="background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
          <span style="font-weight:600;color:#333;">系统设计 ⭐核心</span>
          <span style="color:#FF6B6B;font-weight:700;">54%</span>
        </div>
        <div style="height:8px;background:#EEE;border-radius:4px;overflow:hidden;">
          <div style="width:54%;height:100%;background:linear-gradient(90deg,#FF6B6B,#FFD93D);"></div>
        </div>
      </div>

      <div style="background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
          <span style="font-weight:600;color:#333;">并发编程</span>
          <span style="color:#FFB13D;font-weight:700;">67%</span>
        </div>
        <div style="height:8px;background:#EEE;border-radius:4px;overflow:hidden;">
          <div style="width:67%;height:100%;background:linear-gradient(90deg,#FFD93D,#FFB13D);"></div>
        </div>
      </div>

      <div style="background:#fff;border:2px dashed #D8D4F5;border-radius:14px;padding:16px;text-align:center;margin-bottom:16px;">
        <div style="font-size:24px;margin-bottom:6px;">🔒</div>
        <div style="font-size:13px;font-weight:700;color:#333;">模拟面试待解锁</div>
        <div style="font-size:12px;color:#888;margin-top:4px;">核心知识点「系统设计」还需提升 16%</div>
      </div>

      <button style="width:100%;background:linear-gradient(90deg,#6C5CE7,#8E7CF7);border:none;color:#fff;padding:14px;border-radius:12px;font-weight:700;font-size:14px;">继续今日任务(3/5)</button>
    </div>

    <div style="display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #EEE;background:#fff;">
      <div style="text-align:center;color:#6C5CE7;font-size:11px;font-weight:700;">🏠<br/>首页</div>
      <div style="text-align:center;color:#999;font-size:11px;">📘<br/>学习</div>
      <div style="text-align:center;color:#999;font-size:11px;">💬<br/>自由学习</div>
      <div style="text-align:center;color:#999;font-size:11px;">🎤<br/>模拟面试</div>
      <div style="text-align:center;color:#999;font-size:11px;">👤<br/>我的</div>
    </div>
  </div>
</body>
</html>
