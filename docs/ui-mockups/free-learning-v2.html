<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>学习 Tab · 自由学习 v2 - 静态 HTML 原型</title>
</head>
<body style="margin:0;background:#EEE;padding:32px;">
  <div style="width:375px;max-width:100%;margin:0 auto;font-family:-apple-system,sans-serif;background:#F7F7F8;min-height:600px;box-shadow:0 4px 24px rgba(0,0,0,.12);border-radius:16px;overflow:hidden;">

    <div style="background:#fff;border-bottom:1px solid #ECECEE;padding:16px 16px 14px;">
      <div style="font-size:16px;font-weight:700;color:#1A1A1F;margin-bottom:10px;">学习</div>
      <div style="display:flex;background:#F0F0F2;border-radius:10px;padding:3px;">
        <div style="flex:1;text-align:center;padding:7px 0;font-size:12px;color:#8A8F98;">每日任务</div>
        <div style="flex:1;text-align:center;padding:7px 0;background:#fff;border-radius:8px;font-size:12px;font-weight:700;color:#1A1A1F;box-shadow:0 1px 2px rgba(0,0,0,.08);">自由学习</div>
      </div>
    </div>

    <div style="padding:14px 16px;">
      <div style="font-size:11px;color:#8A8F98;margin-bottom:12px;">随时回顾,不占用今日任务进度</div>

      <div style="background:#E6F7F1;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:12px;color:#0E9F6E;font-weight:700;">AI 为你选了「并发编程」做回顾</div>
        <div style="font-size:11px;color:#0E9F6E;">换一个 ↻</div>
      </div>

      <div style="background:#fff;border:1px solid #ECECEE;border-radius:12px;padding:16px;">
        <div style="font-size:14px;line-height:1.6;color:#1A1A1F;">volatile 关键字能保证原子性吗?为什么?</div>
      </div>

      <textarea style="width:100%;height:110px;margin-top:14px;border-radius:10px;padding:12px;box-sizing:border-box;font-size:13px;border:1px solid #DADCE3;" placeholder="在这里输入你的回答…"></textarea>

      <button style="width:100%;background:#0E9F6E;border:none;color:#fff;padding:14px;border-radius:8px;font-weight:700;font-size:14px;margin-top:14px;">提交回答</button>
    </div>

    <div style="display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #ECECEE;background:#fff;">
      <div style="text-align:center;color:#B0B3BB;font-size:11px;">⌂<br/>首页</div>
      <div style="text-align:center;color:#0E9F6E;font-size:11px;font-weight:700;">▤<br/>学习</div>
      <div style="text-align:center;color:#B0B3BB;font-size:11px;">●<br/>我的</div>
    </div>
  </div>
</body>
</html>
