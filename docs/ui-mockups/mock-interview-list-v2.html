<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>我的 · 模拟面试(未解锁/已解锁)v2 - 静态 HTML 原型</title>
</head>
<body style="margin:0;background:#EEE;padding:32px;">
  <div style="display:flex;gap:24px;flex-wrap:wrap;justify-content:center;">

    <div style="width:340px;max-width:100%;font-family:-apple-system,sans-serif;background:#F7F7F8;box-shadow:0 4px 24px rgba(0,0,0,.12);border-radius:16px;overflow:hidden;">
      <div style="padding:14px 16px;background:#fff;border-bottom:1px solid #ECECEE;font-size:13px;color:#8A8F98;">← 我的 · 模拟面试</div>
      <div style="padding:16px;">
        <div style="font-size:11px;color:#8A8F98;margin-bottom:8px;">未解锁</div>
        <div style="background:#fff;border:1px solid #ECECEE;border-radius:12px;padding:20px;text-align:center;">
          <div style="font-size:14px;font-weight:700;color:#1A1A1F;">模拟面试待解锁</div>
          <div style="font-size:12px;color:#8A8F98;margin-top:4px;">核心知识点「系统设计」还需提升 16%</div>
          <button style="margin-top:12px;background:#E6F7F1;border:none;color:#0E9F6E;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;">去学习 →</button>
        </div>
      </div>
    </div>

    <div style="width:340px;max-width:100%;font-family:-apple-system,sans-serif;background:#F7F7F8;box-shadow:0 4px 24px rgba(0,0,0,.12);border-radius:16px;overflow:hidden;">
      <div style="padding:14px 16px;background:#fff;border-bottom:1px solid #ECECEE;font-size:13px;color:#8A8F98;">← 我的 · 模拟面试</div>
      <div style="padding:16px;">
        <div style="font-size:11px;color:#8A8F98;margin-bottom:8px;">已解锁</div>
        <button style="width:100%;background:#0E9F6E;border:none;color:#fff;padding:14px;border-radius:8px;font-weight:700;font-size:14px;margin-bottom:14px;">开始新的模拟面试</button>

        <div style="font-size:12px;font-weight:700;color:#1A1A1F;margin-bottom:8px;">历次报告</div>
        <div style="background:#fff;border:1px solid #ECECEE;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-size:13px;font-weight:600;color:#1A1A1F;">09-14 · 第 3 次</div>
            <div style="font-size:11px;color:#0E9F6E;">比上次 +6</div>
          </div>
          <div style="font-size:16px;font-weight:800;color:#0E9F6E;">79</div>
        </div>
        <div style="background:#fff;border:1px solid #ECECEE;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-size:13px;font-weight:600;color:#1A1A1F;">09-10 · 第 2 次</div>
          </div>
          <div style="font-size:16px;font-weight:800;color:#B0B3BB;">73</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
