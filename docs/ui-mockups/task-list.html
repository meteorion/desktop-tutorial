<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>学习 Tab · 今日任务清单 - 静态 HTML 原型</title>
</head>
<body style="margin:0;background:#EEE;padding:32px;">
  <div style="width:375px;max-width:100%;margin:0 auto;font-family:-apple-system,sans-serif;background:#FAFAFC;min-height:600px;box-shadow:0 4px 24px rgba(0,0,0,.12);border-radius:16px;overflow:hidden;">

    <div style="background:linear-gradient(135deg,#6C5CE7,#00D2A8);padding:18px;color:#fff;">
      <div style="font-size:13px;opacity:.85;">今日任务</div>
      <div style="font-size:20px;font-weight:800;margin-top:2px;">3 / 5 已完成</div>
      <div style="height:6px;background:rgba(255,255,255,.3);border-radius:3px;margin-top:10px;overflow:hidden;">
        <div style="width:60%;height:100%;background:#fff;"></div>
      </div>
    </div>

    <div style="padding:14px 16px;">
      <div style="display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;opacity:.55;box-shadow:0 1px 3px rgba(0,0,0,.05);">
        <div style="width:26px;height:26px;border-radius:50%;background:#00B894;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;">✓</div>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:600;color:#333;text-decoration:line-through;">Java 基础 · 练习题</div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;opacity:.55;box-shadow:0 1px 3px rgba(0,0,0,.05);">
        <div style="width:26px;height:26px;border-radius:50%;background:#00B894;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;">✓</div>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:600;color:#333;text-decoration:line-through;">并发编程 · 知识卡片</div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;opacity:.55;box-shadow:0 1px 3px rgba(0,0,0,.05);">
        <div style="width:26px;height:26px;border-radius:50%;background:#00B894;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;">✓</div>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:600;color:#333;text-decoration:line-through;">并发编程 · 练习题</div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #6C5CE7;border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);">
        <div style="width:26px;height:26px;border-radius:50%;background:#F4F1FF;color:#6C5CE7;display:flex;align-items:center;justify-content:center;font-size:13px;">📘</div>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:700;color:#333;">系统设计 · 练习题</div>
          <span style="font-size:10px;background:#FFF1D6;color:#B8860B;padding:1px 7px;border-radius:8px;">核心</span>
        </div>
        <div style="color:#6C5CE7;font-size:13px;">→</div>
      </div>

      <div style="display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);">
        <div style="width:26px;height:26px;border-radius:50%;background:#F0F0F0;color:#999;display:flex;align-items:center;justify-content:center;font-size:13px;">🗂</div>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:600;color:#999;">系统设计 · 知识卡片</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
