<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>我的 - 静态 HTML 原型</title>
</head>
<body style="margin:0;background:#EEE;padding:32px;">
  <div style="width:375px;max-width:100%;margin:0 auto;font-family:-apple-system,sans-serif;background:#FAFAFC;min-height:600px;box-shadow:0 4px 24px rgba(0,0,0,.12);border-radius:16px;overflow:hidden;">

    <div style="background:linear-gradient(135deg,#6C5CE7,#00D2A8);padding:20px 18px;color:#fff;">
      <div style="width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:20px;">👤</div>
      <div style="font-size:15px;font-weight:700;margin-top:10px;">求职中 · 后端开发-Java</div>
      <div style="font-size:12px;opacity:.85;margin-top:2px;">目标薪资 25K-35K</div>
    </div>

    <div style="padding:14px 16px;">
      <div style="font-size:11px;color:#9aa0ab;margin-bottom:12px;">以下设置项均可点击进入编辑</div>

      <div style="font-size:11px;color:#767b87;font-weight:700;margin:6px 0;">求职设置</div>
      <div style="background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:14px;">
        <div style="padding:13px 14px;border-bottom:1px solid #F2F2F5;">
          <span style="font-size:13px;color:#333;">🎯 目标岗位与薪资</span>
        </div>
        <div style="padding:13px 14px;">
          <span style="font-size:13px;color:#333;">📄 重新导入简历</span>
        </div>
      </div>

      <div style="font-size:11px;color:#767b87;font-weight:700;margin:6px 0;">AI 服务</div>
      <div style="background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:1px solid #F2F2F5;">
          <span style="font-size:13px;color:#333;">🤖 LLM 提供商</span>
          <span style="font-size:12px;color:#6b7280;">Claude</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:13px 14px;">
          <span style="font-size:13px;color:#333;">🔑 API Key</span>
          <span style="font-size:12px;color:#00B894;">已配置 ✓</span>
        </div>
      </div>

      <div style="font-size:11px;color:#767b87;font-weight:700;margin:6px 0;">数据</div>
      <div style="background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);">
        <div style="padding:13px 14px;border-bottom:1px solid #F2F2F5;">
          <span style="font-size:13px;color:#333;">⬇️ 导出备份</span>
        </div>
        <div style="padding:13px 14px;">
          <span style="font-size:13px;color:#333;">⬆️ 从备份恢复</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
