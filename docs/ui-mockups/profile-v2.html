<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>我的 v2 - 静态 HTML 原型</title>
</head>
<body style="margin:0;background:#EEE;padding:32px;">
  <div style="width:375px;max-width:100%;margin:0 auto;font-family:-apple-system,sans-serif;background:#F7F7F8;min-height:600px;box-shadow:0 4px 24px rgba(0,0,0,.12);border-radius:16px;overflow:hidden;">

    <div style="background:#fff;border-bottom:1px solid #ECECEE;padding:20px 18px;">
      <div style="width:48px;height:48px;border-radius:50%;background:#E6F7F1;display:flex;align-items:center;justify-content:center;font-size:16px;color:#0E9F6E;font-weight:700;">求</div>
      <div style="font-size:15px;font-weight:700;color:#1A1A1F;margin-top:10px;">求职中 · 后端开发-Java</div>
      <div style="font-size:12px;color:#8A8F98;margin-top:2px;">目标薪资 25K-35K</div>
    </div>

    <div style="padding:14px 16px;">
      <div style="font-size:11px;color:#8A8F98;margin-bottom:12px;">以下设置项均可点击进入编辑</div>

      <div style="font-size:11px;color:#8A8F98;font-weight:700;margin:6px 0;">求职进展</div>
      <div style="background:#fff;border:1px solid #ECECEE;border-radius:10px;overflow:hidden;margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:1px solid #F2F2F5;">
          <span style="font-size:13px;color:#1A1A1F;">模拟面试</span>
          <span style="font-size:12px;color:#0E9F6E;font-weight:700;">已解锁 · 3 次记录 ›</span>
        </div>
        <div style="padding:13px 14px;border-bottom:1px solid #F2F2F5;">
          <span style="font-size:13px;color:#1A1A1F;">目标岗位与薪资</span>
        </div>
        <div style="padding:13px 14px;">
          <span style="font-size:13px;color:#1A1A1F;">重新导入简历</span>
        </div>
      </div>

      <div style="font-size:11px;color:#8A8F98;font-weight:700;margin:6px 0;">AI 服务</div>
      <div style="background:#fff;border:1px solid #ECECEE;border-radius:10px;overflow:hidden;margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:1px solid #F2F2F5;">
          <span style="font-size:13px;color:#1A1A1F;">LLM 提供商</span>
          <span style="font-size:12px;color:#8A8F98;">Claude</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:13px 14px;">
          <span style="font-size:13px;color:#1A1A1F;">API Key</span>
          <span style="font-size:12px;color:#0E9F6E;font-weight:700;">已配置</span>
        </div>
      </div>

      <div style="font-size:11px;color:#8A8F98;font-weight:700;margin:6px 0;">数据</div>
      <div style="background:#fff;border:1px solid #ECECEE;border-radius:10px;overflow:hidden;">
        <div style="padding:13px 14px;border-bottom:1px solid #F2F2F5;">
          <span style="font-size:13px;color:#1A1A1F;">↓ 导出备份</span>
        </div>
        <div style="padding:13px 14px;">
          <span style="font-size:13px;color:#1A1A1F;">↑ 从备份恢复</span>
        </div>
      </div>
    </div>

    <div style="display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #ECECEE;background:#fff;">
      <div style="text-align:center;color:#B0B3BB;font-size:11px;">⌂<br/>首页</div>
      <div style="text-align:center;color:#B0B3BB;font-size:11px;">▤<br/>学习</div>
      <div style="text-align:center;color:#0E9F6E;font-size:11px;font-weight:700;">●<br/>我的</div>
    </div>
  </div>
</body>
</html>
