<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>首页 / 掌握进度看板 v2 - 静态 HTML 原型</title>
</head>
<body style="margin:0;background:#EEE;padding:32px;">
  <div style="width:375px;max-width:100%;margin:0 auto;font-family:-apple-system,sans-serif;background:#F7F7F8;box-shadow:0 4px 24px rgba(0,0,0,.12);border-radius:16px;overflow:hidden;">

    <div style="background:#fff;border-bottom:1px solid #ECECEE;padding:20px 18px 18px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-size:12px;color:#8A8F98;">目标岗位</div>
          <div style="font-size:18px;font-weight:700;color:#1A1A1F;margin-top:2px;">后端开发 · Java</div>
        </div>
        <div style="background:#F0FAF6;border-radius:16px;padding:5px 11px;font-size:12px;font-weight:700;color:#0E9F6E;">🔥 连续 5 天</div>
      </div>

      <div style="display:flex;align-items:center;gap:14px;margin-top:18px;">
        <div style="width:64px;height:64px;border-radius:50%;background:conic-gradient(#0E9F6E 0deg 259deg, #ECECEE 259deg 360deg);display:flex;align-items:center;justify-content:center;">
          <div style="width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#1A1A1F;">72%</div>
        </div>
        <div>
          <div style="font-size:13px;font-weight:700;color:#1A1A1F;">整体掌握度 72%</div>
          <div style="font-size:12px;color:#8A8F98;margin-top:2px;">距解锁模拟面试还差 8%</div>
        </div>
      </div>
    </div>

    <div style="padding:16px 18px;">
      <div style="font-size:12px;font-weight:700;color:#1A1A1F;margin-bottom:10px;">知识点掌握度</div>

      <div style="background:#fff;border:1px solid #ECECEE;border-radius:10px;padding:12px 14px;margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
          <span style="font-weight:600;color:#1A1A1F;">Java 基础</span>
          <span style="color:#0E9F6E;font-weight:700;">88%</span>
        </div>
        <div style="height:5px;background:#ECECEE;border-radius:3px;overflow:hidden;">
          <div style="width:88%;height:100%;background:#0E9F6E;"></div>
        </div>
      </div>

      <div style="background:#fff;border:1px solid #ECECEE;border-radius:10px;padding:12px 14px;margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
          <span style="font-weight:600;color:#1A1A1F;">系统设计 <span style="background:#E6F7F1;color:#0E9F6E;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;margin-left:2px;">核心</span></span>
          <span style="color:#E8735C;font-weight:700;">54%</span>
        </div>
        <div style="height:5px;background:#ECECEE;border-radius:3px;overflow:hidden;">
          <div style="width:54%;height:100%;background:#E8735C;"></div>
        </div>
      </div>

      <div style="background:#fff;border:1px solid #ECECEE;border-radius:10px;padding:12px 14px;margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
          <span style="font-weight:600;color:#1A1A1F;">并发编程</span>
          <span style="color:#D9A441;font-weight:700;">67%</span>
        </div>
        <div style="height:5px;background:#ECECEE;border-radius:3px;overflow:hidden;">
          <div style="width:67%;height:100%;background:#D9A441;"></div>
        </div>
      </div>

      <div style="background:#fff;border:1px solid #ECECEE;border-radius:12px;padding:16px;text-align:center;margin-bottom:16px;">
        <div style="font-size:13px;font-weight:700;color:#1A1A1F;">模拟面试待解锁</div>
        <div style="font-size:12px;color:#8A8F98;margin-top:4px;">核心知识点「系统设计」还需提升 16%</div>
      </div>

      <button style="width:100%;background:#0E9F6E;border:none;color:#fff;padding:14px;border-radius:8px;font-weight:700;font-size:14px;">继续今日任务(3/5)</button>
    </div>

    <div style="display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #ECECEE;background:#fff;">
      <div style="text-align:center;color:#0E9F6E;font-size:11px;font-weight:700;">⌂<br/>首页</div>
      <div style="text-align:center;color:#B0B3BB;font-size:11px;">▤<br/>学习</div>
      <div style="text-align:center;color:#B0B3BB;font-size:11px;">●<br/>我的</div>
    </div>
  </div>
</body>
</html>
