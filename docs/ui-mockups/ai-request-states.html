<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>AI 请求:加载中/失败重试 - 静态 HTML 原型</title>
</head>
<body style="margin:0;background:#EEE;padding:32px;">
  <div style="width:340px;max-width:100%;margin:0 auto;font-family:-apple-system,sans-serif;background:#FAFAFC;box-shadow:0 4px 24px rgba(0,0,0,.12);border-radius:16px;overflow:hidden;">

    <div style="padding:16px;border-bottom:1px dashed #E0DCF5;">
      <div style="font-size:11px;color:#9aa0ab;margin-bottom:8px;">加载中(按钮态)</div>
      <button style="width:100%;background:linear-gradient(90deg,#B7ACF0,#B9E8DD);border:none;color:#fff;padding:14px;border-radius:12px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
        <span style="width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:inline-block;"></span>
        AI 正在批改…
      </button>
    </div>

    <div style="padding:16px;">
      <div style="font-size:11px;color:#9aa0ab;margin-bottom:8px;">失败态(内联,不丢用户已填内容)</div>
      <div style="background:#FFF0F0;border:1px solid #FFC9C9;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:12px;color:#C0392B;">⚠️ 请求失败,网络似乎有点问题</div>
        <button style="background:#fff;border:1px solid #FF6B6B;color:#FF6B6B;padding:6px 12px;border-radius:16px;font-size:12px;font-weight:700;">重试</button>
      </div>
    </div>
  </div>
</body>
</html>
