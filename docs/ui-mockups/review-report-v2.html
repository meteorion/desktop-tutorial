<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>AI 审核报告页 v2 - 静态 HTML 原型</title>
</head>
<body style="margin:0;background:#EEE;padding:32px;">
  <div style="width:375px;max-width:100%;margin:0 auto;font-family:-apple-system,sans-serif;background:#F7F7F8;min-height:640px;box-shadow:0 4px 24px rgba(0,0,0,.12);border-radius:16px;overflow:hidden;">

    <div style="background:#0E9F6E;padding:22px 18px 26px;color:#fff;text-align:center;">
      <div style="font-size:12px;opacity:.85;">后端开发-Java · 2026-09-14</div>
      <div style="font-size:40px;font-weight:800;margin-top:6px;">79</div>
      <div style="font-size:13px;opacity:.9;margin-top:2px;">综合得分 · 比上次 +6</div>
    </div>

    <div style="padding:16px 18px;">

      <div style="background:#fff;border:1px solid #ECECEE;border-radius:10px;padding:14px;">
        <div style="font-size:12px;font-weight:700;color:#1A1A1F;margin-bottom:10px;">维度得分</div>

        <div style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">
            <span style="color:#4A4F5A;">专业知识/技能准确度</span><span style="font-weight:700;color:#0E9F6E;">82</span>
          </div>
          <div style="height:5px;background:#ECECEE;border-radius:3px;overflow:hidden;"><div style="width:82%;height:100%;background:#0E9F6E;"></div></div>
        </div>

        <div style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">
            <span style="color:#4A4F5A;">表达与逻辑结构</span><span style="font-weight:700;color:#0E9F6E;">75</span>
          </div>
          <div style="height:5px;background:#ECECEE;border-radius:3px;overflow:hidden;"><div style="width:75%;height:100%;background:#0E9F6E;"></div></div>
        </div>

        <div>
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">
            <span style="color:#B0B3BB;">非语言信号(语调/自信度)</span><span style="font-weight:700;color:#B0B3BB;">敬请期待</span>
          </div>
          <div style="height:5px;background:#F0F0F0;border-radius:3px;"></div>
        </div>
      </div>

      <div style="background:#fff;border:1px solid #ECECEE;border-left:3px solid #0E9F6E;border-radius:10px;padding:14px;margin-top:12px;">
        <div style="font-size:12px;font-weight:700;color:#0E9F6E;margin-bottom:6px;">亮点</div>
        <div style="font-size:13px;color:#4A4F5A;line-height:1.6;">对并发场景的排查思路清晰,能主动举实际项目例子佐证。</div>
      </div>

      <div style="background:#fff;border:1px solid #ECECEE;border-left:3px solid #E8735C;border-radius:10px;padding:14px;margin-top:12px;">
        <div style="font-size:12px;font-weight:700;color:#E8735C;margin-bottom:6px;">不足</div>
        <div style="font-size:13px;color:#4A4F5A;line-height:1.6;">对分布式锁失效场景的边界考虑不够完整,回答略显仓促。</div>
      </div>

      <div style="background:#F7F7F8;border:1px solid #ECECEE;border-radius:10px;padding:14px;margin-top:12px;">
        <div style="font-size:12px;font-weight:700;color:#1A1A1F;margin-bottom:6px;">针对性建议</div>
        <div style="font-size:13px;color:#4A4F5A;line-height:1.6;">建议强化「系统设计」中的容错与降级方案设计,已为你加入明日学习任务。</div>
      </div>

      <button style="width:100%;background:#0E9F6E;border:none;color:#fff;padding:14px;border-radius:8px;font-weight:700;font-size:14px;margin-top:16px;">去强化薄弱知识点 →</button>
    </div>
  </div>
</body>
</html>
