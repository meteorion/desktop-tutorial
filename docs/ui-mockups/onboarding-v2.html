<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>引导页 · 目标设定与简历导入 v2 - 静态 HTML 原型</title>
</head>
<body style="margin:0;background:#EEE;padding:32px;">
  <div style="display:flex;gap:24px;flex-wrap:wrap;justify-content:center;">

    <div style="width:375px;max-width:100%;font-family:-apple-system,sans-serif;background:#F7F7F8;min-height:600px;box-shadow:0 4px 24px rgba(0,0,0,.12);border-radius:16px;overflow:hidden;">
      <div style="padding:18px 16px;background:#fff;border-bottom:1px solid #ECECEE;">
        <div style="font-size:17px;font-weight:700;color:#1A1A1F;">设定目标</div>
        <div style="font-size:12px;color:#8A8F98;margin-top:4px;">告诉我们你的目标岗位,AI 来定制专属学习计划</div>
      </div>

      <div style="padding:16px;">
        <div style="font-size:12px;font-weight:700;color:#1A1A1F;margin-bottom:8px;">目标岗位</div>
        <div style="background:#fff;border:1px solid #DADCE3;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <span style="font-size:13px;color:#1A1A1F;">后端开发 · Java</span>
          <span style="color:#8A8F98;font-size:12px;">⌄</span>
        </div>

        <div style="font-size:12px;font-weight:700;color:#1A1A1F;margin-bottom:8px;">目标薪资</div>
        <div style="background:#fff;border:1px solid #DADCE3;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <span style="font-size:13px;color:#1A1A1F;">25K - 35K</span>
          <span style="color:#8A8F98;font-size:12px;">⌄</span>
        </div>

        <div style="font-size:12px;font-weight:700;color:#1A1A1F;margin-bottom:8px;">导入简历(可选)</div>
        <div style="background:#fff;border:1.5px dashed #DADCE3;border-radius:10px;padding:18px 14px;text-align:center;margin-bottom:8px;">
          <div style="font-size:13px;font-weight:600;color:#1A1A1F;">上传 PDF / Word 简历</div>
          <div style="font-size:11px;color:#8A8F98;margin-top:4px;">AI 会据此预填岗位/薪资,并识别你已掌握的知识点</div>
        </div>
        <div style="font-size:12px;color:#8A8F98;text-align:center;margin-bottom:16px;">不上传也可以,直接从零开始评估</div>

        <button style="width:100%;background:#0E9F6E;border:none;color:#fff;padding:14px;border-radius:8px;font-weight:700;font-size:14px;">生成面试计划</button>
      </div>
    </div>

    <div style="width:375px;max-width:100%;font-family:-apple-system,sans-serif;background:#F7F7F8;min-height:600px;box-shadow:0 4px 24px rgba(0,0,0,.12);border-radius:16px;overflow:hidden;">
      <div style="padding:18px 16px;background:#fff;border-bottom:1px solid #ECECEE;">
        <div style="font-size:17px;font-weight:700;color:#1A1A1F;">确认解析结果</div>
        <div style="font-size:12px;color:#8A8F98;margin-top:4px;">resume_张三.pdf 解析完成,请确认以下信息</div>
      </div>

      <div style="padding:16px;">
        <div style="background:#fff;border:1px solid #ECECEE;border-radius:10px;padding:14px;margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:12px;color:#8A8F98;">目标岗位</span>
            <span style="font-size:10px;background:#FFF4E5;color:#8A5A00;padding:2px 7px;border-radius:8px;">推测填写,请确认</span>
          </div>
          <div style="font-size:14px;font-weight:700;color:#1A1A1F;margin-top:4px;">后端开发 · Java</div>
        </div>

        <div style="background:#fff;border:1px solid #ECECEE;border-radius:10px;padding:14px;margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:12px;color:#8A8F98;">目标薪资</span>
            <span style="font-size:10px;background:#FFF4E5;color:#8A5A00;padding:2px 7px;border-radius:8px;">推测填写,请确认</span>
          </div>
          <div style="font-size:14px;font-weight:700;color:#1A1A1F;margin-top:4px;">22K - 30K</div>
        </div>

        <div style="background:#fff;border:1px solid #ECECEE;border-radius:10px;padding:14px;margin-bottom:16px;">
          <div style="font-size:12px;color:#8A8F98;margin-bottom:6px;">已识别的能力项(3)</div>
          <div style="font-size:12px;color:#1A1A1F;">Spring Boot · MySQL 基础 · Git 协作</div>
        </div>

        <button style="width:100%;background:#0E9F6E;border:none;color:#fff;padding:14px;border-radius:8px;font-weight:700;font-size:14px;margin-bottom:8px;">确认无误,生成计划</button>
        <div style="text-align:center;font-size:12px;color:#8A8F98;">重新调整</div>
      </div>
    </div>
  </div>
</body>
</html>
